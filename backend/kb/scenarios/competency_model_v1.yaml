version: "v1"
name: "AI Sales Academy Competency Model"
competencies:
  - key: "questioning"
    title: "Умение задавать вопросы"
    description: "Менеджер управляет диалогом через открытые и уточняющие вопросы."
    levels:
      - level: "Junior"
        description: "Задает отдельные вопросы, но часто перескакивает между темами."
        observable_signals:
          - "Использует 1-2 открытых вопроса."
          - "Редко уточняет контекст ответа клиента."
      - level: "Middle"
        description: "Строит логичную цепочку вопросов и удерживает тему разговора."
        observable_signals:
          - "Уточняет причины, масштаб и приоритет проблемы."
          - "Поддерживает последовательность диалога."
      - level: "Senior"
        description: "Тонко управляет разговором и извлекает информацию без давления."
        observable_signals:
          - "Комбинирует открытые, уточняющие и проверочные вопросы."
          - "Помогает клиенту самому сформулировать потребность."
  - key: "need_diagnosis"
    title: "Диагностика потребности"
    description: "Менеджер выявляет реальную проблему, контекст и последствия без решения."
    levels:
      - level: "Junior"
        description: "Фиксирует общий запрос, но слабо раскрывает бизнес-контекст."
        observable_signals:
          - "Слышит поверхностную формулировку проблемы."
          - "Не до конца понимает, что мешает клиенту сейчас."
      - level: "Middle"
        description: "Понимает причины, влияние и приоритет потребности."
        observable_signals:
          - "Выявляет процесс, где возникает проблема."
          - "Уточняет последствия бездействия."
      - level: "Senior"
        description: "Формирует объемную карту потребности и критерии принятия решения."
        observable_signals:
          - "Связывает проблему с метриками, сроками и рисками."
          - "Уточняет, кто влияет на решение и что важно для согласования."
  - key: "value_through_benefit"
    title: "Формулировка ценности через выгоду"
    description: "Менеджер объясняет ценность решения через выгоду для клиента, а не через функции."
    levels:
      - level: "Junior"
        description: "Описывает продукт через возможности и общие обещания."
        observable_signals:
          - "Часто перечисляет функции без привязки к задаче."
          - "Использует абстрактные формулировки пользы."
      - level: "Middle"
        description: "Связывает свойства решения с конкретной выгодой клиента."
        observable_signals:
          - "Объясняет, как решение влияет на процесс клиента."
          - "Показывает ценность на одном или двух примерах."
      - level: "Senior"
        description: "Переводит ценность в бизнес-результат и язык клиента."
        observable_signals:
          - "Говорит через ROI, сроки, контроль и снижение рисков."
          - "Использует аргументы, точно попадающие в выявленную потребность."
  - key: "think_it_over_objection"
    title: "Работа с возражением «подумаю / не сейчас»"
    description: "Менеджер раскрывает истинную причину отсрочки и мягко возвращает диалог к решению."
    levels:
      - level: "Junior"
        description: "Принимает возражение буквально и быстро завершает разговор."
        observable_signals:
          - "Не уточняет, что именно клиент хочет обдумать."
          - "Не работает с риском потери темпа сделки."
      - level: "Middle"
        description: "Тактично исследует причину сомнений и помогает конкретизировать барьер."
        observable_signals:
          - "Уточняет, что стоит за фразой 'не сейчас'."
          - "Предлагает безопасный следующий шаг без давления."
      - level: "Senior"
        description: "Выявляет скрытое возражение и переводит его в предметное обсуждение."
        observable_signals:
          - "Отделяет нехватку приоритета от страха риска или цены."
          - "Снимает неопределенность через ясный и удобный формат продолжения."
  - key: "next_step_fixation"
    title: "Фиксация следующего шага"
    description: "Менеджер завершает разговор конкретным и подтвержденным следующим действием."
    levels:
      - level: "Junior"
        description: "Завершает разговор без четкой договоренности."
        observable_signals:
          - "Оставляет следующий шаг размытым."
          - "Не подтверждает ответственность и срок."
      - level: "Middle"
        description: "Предлагает конкретный следующий шаг и получает согласие."
        observable_signals:
          - "Фиксирует формат и ориентир по времени."
          - "Понимает, кто участвует в следующем касании."
      - level: "Senior"
        description: "Делает следующий шаг естественным продолжением логики разговора."
        observable_signals:
          - "Привязывает шаг к выгоде клиента."
          - "Подтверждает действие, срок и критерий полезности встречи."
