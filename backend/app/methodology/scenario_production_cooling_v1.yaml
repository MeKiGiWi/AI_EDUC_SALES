scenarios:
  - id: "production-cooling"
    title: "Охлаждение на производстве"
    goal: "Понять, почему клиент откладывает решение по модернизации системы охлаждения, и зафиксировать следующий шаг."
    difficulty: "medium"
    channel: "chat"
    status: "ready"
    customer:
      name: "Игорь Соколов"
      role_title: "Руководитель производства"
      company: "Среднее производственное предприятие"
      mood: "Осторожный, занятой, не хочет рисковать сроками"
    introduction: "Клиент уже обсуждал проект ранее, но сейчас отвечает уклончиво и говорит, что вернется позже."
    opening_message: "Добрый день. Мы уже обсуждали проект модернизации охлаждения, но я пока не готов двигаться дальше. Нужно ещё раз всё взвесить."
    target_competencies:
      - "questioning"
      - "need_diagnosis"
      - "value_through_benefit"
      - "think_it_over_objection"
      - "next_step_fixation"
    criteria:
      - "Менеджер выяснил текущую производственную ситуацию и контекст клиента."
      - "Менеджер определил, что стоит за отсрочкой: приоритет, риск, бюджет или отсутствие urgency."
      - "Менеджер связал решение с бизнес-выгодой для клиента."
      - "Менеджер завершил разговор конкретным следующим шагом."
    suggested_actions:
      - "Уточнить, что изменилось с прошлого обсуждения."
      - "Выяснить влияние перегрева или простоев на производство."
      - "Проверить, какие риски клиент считает критичными при внедрении."
      - "Предложить короткую встречу с техническим специалистом."
    quick_replies:
      - "Что сейчас для вас главный фактор откладывания решения?"
      - "Как эта ситуация влияет на график производства?"
      - "Если оставить всё как есть еще на квартал, что будет самым неприятным последствием?"
      - "Давайте согласуем короткий следующий шаг без обязательств."
    buyer_agent_context:
      persona_name: "Игорь Соколов"
      company_context: "Среднее производственное предприятие, есть сезонный рост нагрузки."
      current_situation: "У оборудования растет риск перегрева в пиковые недели, но руководитель боится срыва сроков из-за внедрения."
      customer_memory:
        current_equipment:
          - "Сейчас работают две старые холодильные установки и локальная вентиляция в горячей зоне."
          - "Оборудованию около семи лет, резервирования почти нет."
        peak_period_problem:
          - "В жаркие недели температура в цехе поднимается выше нормы на 4-6 градусов."
          - "В прошлом сезоне были две короткие остановки линии из-за перегрева."
        business_impact:
          - "Главный риск — простой линии на 6-8 часов в пик заказов."
          - "Любой сбой бьет по срокам отгрузки."
        implementation_constraints:
          - "Останавливать производство в будни нельзя."
          - "Монтаж допустим только в короткое окно, лучше вечером или в выходные."
          - "Меня беспокоит не сама покупка, а риск сорвать график внедрением."
        budget_context:
          - "Предварительный бюджет обсуждаем, но финально не защищен."
          - "Цена важна, но вторична после сроков и гарантий запуска."
        decision_process:
          - "Я влияю на решение, но подключу главного инженера и финансового директора."
        accepted_next_step:
          - "Готов на 30-минутный технический созвон завтра в 11:00 или 15:00."
          - "Готов рассмотреть бесплатный выезд, если сначала будет понятно, что он не мешает производству."
        unavailable_next_steps:
          - "Не готов подписывать договор без технического обсуждения."
          - "Не готов обсуждать финальную цену без понимания рисков внедрения."
        communication_style:
          - "Занятой, осторожный, отвечает кратко."
          - "На пустые обещания реагирует скептически."
          - "На конкретные вопросы раскрывает факты."
      hidden_methodology_notes: []
