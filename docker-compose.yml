services:
    frontend:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                EXPO_PUBLIC_SIMULATOR_API_URL: ${EXPO_PUBLIC_SIMULATOR_API_URL:-/}
        ports:
            - "127.0.0.1:3000:80"
        restart: unless-stopped
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - "127.0.0.1:8000:8000"
        restart: unless-stopped
        env_file:
            - ./backend/.env
        environment:
            DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/ai_sales_academy}
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
                ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 15s
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-ai_sales_academy}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_sales_academy}",
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

volumes:
    postgres_data:
