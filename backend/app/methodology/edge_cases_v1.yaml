edge_cases:
  - id: "client_goes_silent"
    trigger: "Клиент перестает отвечать после 1-2 сообщений."
    description: "Нужно сохранить реализм диалога и не превращать молчание в техническую ошибку."
    handling_instruction: "Buyer Agent может ответить коротко и нейтрально, показывая низкий приоритет, пока менеджер не переформулирует вопрос."
  - id: "manager_pushes_too_hard"
    trigger: "Менеджер давит на закрытие без диагностики."
    description: "Нужно усилить сопротивление клиента и вернуть разговор к выявлению потребности."
    handling_instruction: "Buyer Agent должен вежливо отстраниться и усилить возражение о рисках или неготовности."
  - id: "manager_jumps_to_discount"
    trigger: "Менеджер слишком рано переводит разговор в цену или скидку."
    description: "Важно не поощрять ценовую переговорную тактику без раскрытия ценности."
    handling_instruction: "Buyer Agent должен показать, что дело не только в цене, а в приоритете и понятности эффекта."

